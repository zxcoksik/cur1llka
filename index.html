<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Каталог товаров</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Каталог товаров</h1>

  <div class="tools">
    <div class="searchWrap">
      <input id="search" type="search" autocomplete="off" placeholder="Поиск по артикулу, названию или группе">
      <button id="clearSearch" class="clearSearch" type="button" aria-label="Очистить поиск">×</button>
    </div>
    <button id="reset" type="button">Сбросить</button>
  </div>

  <div class="categoryNav">
    <button id="catPrev" class="catArrow" type="button" aria-label="Предыдущие группы">‹</button>
    <div id="categories" class="categories"></div>
    <button id="catNext" class="catArrow" type="button" aria-label="Следующие группы">›</button>
  </div>

  <div class="resultLine"><span id="resultCount"></span></div>
</header>

<main><div id="productGrid" class="grid"></div></main>

<div id="viewer" class="viewer" aria-hidden="true">
  <button id="viewerClose" class="close" type="button" aria-label="Закрыть">×</button>
  <div class="viewerBox">
    <img id="viewerImg" alt="">
    <div id="viewerTitle"></div>
  </div>
</div>

<script src="products.js"></script>
<script src="photos.js"></script>
<script src="app.js"></script>
</body>
</html>
